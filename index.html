<style>

*{box-sizing:border-box}body{margin:0;background:#e9ece6;font-family:"Nunito",system-ui,sans-serif;color:var(--ink)}

.big{font-size:26px;font-weight:900;text-align:center}.fon{font-style:italic;color:var(--gd);text-align:center;font-size:14px}
.opt{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:var(--ink)}
.opt.ok{background:var(--gs);border-color:var(--g);color:var(--gd)}.opt.no{background:#FFE9EE;border-color:var(--r)}
input.t{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);font:inherit;font-size:17px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:16px 8px;border-radius:18px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;min-height:64px;color:var(--ink)}
.tile.em{font-size:36px}.tile.sel{border-color:var(--b);background:#EAF2FE}.tile.ok{border-color:var(--g);background:var(--gs);opacity:.55}.tile.no{border-color:var(--r);background:#FFE9EE}
.fb{text-align:center;font-weight:800;min-height:24px}.fb.ok{color:var(--gd)}.fb.no{color:#c43a58}.ex{font-size:13px;color:var(--soft);text-align:center}
.sp{background:none;border:0;font-size:24px;cursor:pointer}.cta{background:linear-gradient(160deg,#2F80ED,#1F55B5);color:#fff;border-radius:28px;padding:24px 20px;text-align:center}
.cta h2{margin:6px 0;font-size:24px}.cta p{margin:6px 0;opacity:.92}.price{background:var(--y);color:#1b2a6b;border-radius:16px;padding:10px;font-weight:900;font-size:19px;margin:12px 0}
a.go{display:block;background:#fff;color:#C2273F;text-decoration:none;border-radius:18px;padding:16px;font-weight:900;font-size:16px;text-transform:uppercase}
.lang{font-size:20px}

let L=null,done={},app=document.getElementById('app');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/[^a-z ]/g,'').trim();
const sh=a=>[...a].sort(()=>Math.random()-.5);
const t=k=>{const v=(M=='from'?S.pt:S[L])[k];return v&&v.replace(/%X%/g,NM[L])};const tr=i=>i[L];const WV=()=>M=='from'?VO[L]:V;
function say(x){}
const IMGS={};
function IM(i,s){return IMGS[i.id]?`<img src="${IMGS[i.id]}" alt="" style="width:${s||'100%'};height:${s||'100%'};object-fit:contain">`:i.e}
function hd(title,back){return `<div class=hd>${back?`<button onclick="${back}">←</button>`:''}<span>${title}</span></div>`}
function setDone(k){done[k]=1;}
function total(){return 3*4+3}
function lang(){app.innerHTML=hd('Fala Bem')+`<div class=bd><div style="font-size:54px;text-align:center">🇧🇷</div><h1>Escolha seu idioma<br><small style="font-size:15px;color:var(--soft)">Chwazi lang ou · Choose · Elige</small></h1>
<button class=card onclick="L='ht';way()"><span class=em>🇭🇹</span><b>Kreyòl Ayisyen</b></button>
<button class=card onclick="L='en';way()"><span class=em>🇬🇧</span><b>English</b></button>
<button class=card onclick="L='es';way()"><span class=em>🇪🇸</span><b>Español</b></button></div>`}
function way(){const n={ht:'Kreyòl Ayisyen',en:'English',es:'Español'}[L];
app.innerHTML=hd('Fala Bem','lang()')+`<div class=bd><h1>${n}</h1><p class=s>${{ht:'Ki sa ou vle fè?',en:'What do you want to do?',es:'¿Qué quieres hacer?'}[L]} · O que você quer fazer?</p>
<button class=card onclick="M='to';hub()"><span class=em>🇧🇷</span><span><b>${{ht:'Aprann Pòtigè',en:'Learn Portuguese',es:'Aprender portugués'}[L]}</b><small>${n} → Português</small></span></button>
<button class=card onclick="M='from';hub()"><span class=em>${{ht:'🇭🇹',en:'🇬🇧',es:'🇪🇸'}[L]}</span><span><b>Praticar ${NM[L]}</b><small>Português → ${n} · para quem fala português</small></span></button></div>`}
function hub(){const n=Object.keys(done).length;
app.innerHTML=hd('Fala Bem · Demo','way()')+`<div class=bd><h1>${t('hi')}</h1><p class=s>${t('hs')}</p><div class=bar><i style="width:${n/total()*100}%"></i></div>
${Object.keys(TOP).map(k=>{const c=[1,2,3,4].filter(i=>done[k+i]).length;return `<button class=card onclick="topic('${k}')"><span class=em>${TOP[k].e}</span><span><b>${TOP[k].n.pt}</b><small>${TOP[k].n[L]} · ${c}/4</small></span>${c==4?'<span class=done>✓</span>':''}</button>`}).join('')}
<button class=card onclick="verbs()"><span class=em>✍️</span><span><b>${t('verbs')}</b><small>${t('verbsub')} · ${[1,2,3].filter(i=>done['v'+i]).length}/3</small></span></button>
${n>=total()?'':`<button class="btn out" onclick="cta()">${t('btn')} →</button>`}${n>=total()?`<button class="btn fin big" onclick="cta()">🎉 ${t('btn')}</button>`:''}</div>`}
function topic(k){const nm=[t('ass'),t('tra'),t('wri'),t('fin')],cl=['blue','out','','fin'],fn=['assoc','trans','wrt','fnl'];
app.innerHTML=hd(TOP[k].e+' '+TOP[k].n.pt+' · '+TOP[k].n[L],'hub()')+`<div class=bd>${[0,1,2,3].map(i=>`<button class="btn ${cl[i]}" onclick="${fn[i]}('${k}')">${i==3?'🏆 ':''}${nm[i]}${done[k+(i+1)]?' ✓':''}</button>`).join('')}</div>`}
function result(k,idx,s,n,back){setDone(k+idx);app.innerHTML=hd(t('sc'),back)+`<div class=bd style="align-items:center;text-align:center"><div style="font-size:70px">${s==n?'🏆':'🎉'}</div><h1>${s}/${n}</h1><button class=btn onclick="${back}">${t('nxt')}</button></div>`;
if(Object.keys(done).length>=total())setTimeout(()=>{},0)}
function assoc(k){const its=sh(T[k]).slice(0,4),em=sh(its),wd=sh(its);let sel=null,ok=0,bad=null;
function r(){app.innerHTML=hd(t('ass'),`topic('${k}')`)+`<div class=bd><p class=s>${t('tap')}</p><div class=grid>${em.map(i=>`<button class="tile em ${i.m?'ok':sel===i?'sel':''}" onclick="A.pe('${i.id}')">${IM(i,"56px")}</button>`).join('')}${wd.map(i=>`<button class="tile ${i.m?'ok':bad===i?'no':''}" onclick="A.pw('${i.id}')">${M=='from'?tr(i):i.pt}<br><small style="color:var(--soft);font-weight:600">${M=='from'?i.pt:tr(i)}</small></button>`).join('')}</div></div>`}
window.A={pe(id){const i=its.find(x=>x.id==id);if(i.m)return;sel=i;bad=null;r()},pw(id){const i=its.find(x=>x.id==id);if(i.m||!sel)return;say(M=='from'?tr(i):i.pt);if(sel===i){i.m=1;ok++;sel=null;bad=null;r();if(ok==4)setTimeout(()=>result(k,1,4,4,`topic('${k}')`),500)}else{bad=i;r();setTimeout(()=>{bad=null;r()},600)}}};r()}
function quiz(k,qs,idx,title){let n=0,sc=0;
function show(){if(n>=qs.length)return result(k,idx,sc,qs.length,`topic('${k}')`);const q=qs[n];
let h=hd(title,`topic('${k}')`)+`<div class=bd><div class=bar><i style="width:${n/qs.length*100}%"></i></div><div class=stick>${IM(q.i,"100px")}</div>`;
if(q.t=='trans'){const sw=M=='from'?tr(q.i):q.i.pt;h+=`<div class=big>${sw}</div>${M=='from'?'':`<div class=fon>${q.i.fon}</div>`}`+q.o.map((o,j)=>`<button class=opt id=o${j} onclick="Q.a(${j})">${M=='from'?o.pt:tr(o)}</button>`).join('')+`<div class=fb id=fb></div>`}
else{h+=`<div class=big>${M=='from'?q.i.pt:tr(q.i)}</div><p class=s>${t('type')}</p><input class=t id=in autocomplete=off autocapitalize=none onkeydown="if(event.key=='Enter')Q.w()"><button class=btn id=ck onclick="Q.w()">${t('chk')}</button><div class=fb id=fb></div>`}
app.innerHTML=h+'</div>'}
function fin(good,ans){document.getElementById('fb').className='fb '+(good?'ok':'no');document.getElementById('fb').textContent=good?t('ok'):t('no')+' '+ans;if(good)sc++;say(M=='from'?tr(qs[n].i):qs[n].i.pt);setTimeout(()=>{n++;show()},good?900:1700)}
window.Q={a(j){const q=qs[n];if(window.lock)return;const good=q.o[j]===q.i;document.getElementById('o'+j).className='opt '+(good?'ok':'no');if(!good)document.getElementById('o'+q.o.indexOf(q.i)).className='opt ok';window.lock=1;setTimeout(()=>window.lock=0,1000);fin(good,M=='from'?q.i.pt:tr(q.i))},
w(){const q=qs[n],el=document.getElementById('in');if(!el||el.disabled)return;if(!el.value.trim())return;const tg=M=='from'?tr(q.i):q.i.pt;const good=tg.split('/').some(z=>norm(el.value)==norm(z))||(tg.includes('(a)')&&norm(el.value)==norm(tg.replace('(a)','a')));el.disabled=1;document.getElementById('ck').style.display='none';fin(good,tg)}};show()}
function mk(k,n,types){const its=sh(T[k]);return its.slice(0,n).map((i,x)=>({t:types[x%types.length],i,o:sh([i,...sh(T[k].filter(z=>z!==i)).slice(0,3)])}))}
function trans(k){quiz(k,mk(k,6,['trans']),2,t('tra'))}
function wrt(k){quiz(k,mk(k,6,['write']),3,t('wri'))}
function fnl(k){const qs=sh(SEN[k]);let n=0,sc=0,first=true,sel=[],tk,lock=0;
function tg(s){return M=='from'?s[L]:s.pt}function hint(s){return M=='from'?s.pt:s[L]}
function show(){if(n>=qs.length){return result(k,4,sc,qs.length,`topic('${k}')`)}
const q=qs[n];if(!tk){tk=sh(tg(q).split(' ').map((w,i)=>({id:i,w})));sel=[]}
const avail=tk.filter(x=>!sel.includes(x.id));
app.innerHTML=hd('🏆 '+t('fin'),`topic('${k}')`)+`<div class=bd><div class=bar><i style="width:${n/qs.length*100}%"></i></div><p class=s>${t('ord')}</p><div class=big style="font-size:19px">${hint(q)}</div>
<div id=ans style="min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:2px solid ${lock==1?'var(--g)':lock==2?'var(--r)':'var(--line)'};border-radius:18px;background:${lock==1?'var(--gs)':lock==2?'#FFE9EE':'#fff'}">${sel.map(i=>`<span class=opt style="width:auto;padding:8px 12px">${tk[tk.findIndex(x=>x.id==i)].w}</span>`).join('')}</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px">${avail.map(x=>`<button class=opt style="width:auto;padding:10px 14px" onclick="O.p(${x.id})">${x.w}</button>`).join('')}</div>
<button class="btn out" style="margin-top:6px" onclick="O.u()">⌫ ${t('undo')}</button></div>`}
window.O={p(id){if(lock)return;sel.push(id);if(sel.length==tk.length){const m=sel.map(i=>tk.find(x=>x.id==i).w).join(' ');if(m==tg(qs[n])){lock=1;if(first)sc++;show();setTimeout(()=>{lock=0;n++;tk=null;first=true;show()},900)}else{lock=2;first=false;show();setTimeout(()=>{lock=0;sel=[];show()},900)}}else show()},u(){if(lock)return;sel.pop();show()}};show()}
function verbs(){app.innerHTML=hd(t('vtopic'),'hub()')+`<div class=bd>${[1,2,3].map(i=>`<button class="btn ${i==3?'':'blue'}" onclick="vex(${i})">${t('ex')} ${i}${done['v'+i]?' ✓':''}</button>`).join('')}</div>`}
function vex(i){const qs=WV()[i-1];let n=0,sc=0,lock=0;
function show(){if(n>=qs.length){setDone('v'+i);app.innerHTML=hd(t('sc'),'verbs()')+`<div class=bd style="text-align:center"><div style="font-size:70px">${sc==qs.length?'🏆':'🎉'}</div><h1>${sc}/${qs.length}</h1><button class=btn onclick="verbs()">${t('nxt')}</button></div>`;return}
const q=qs[n];app.innerHTML=hd(t('ex')+' '+i,'verbs()')+`<div class=bd><div class=bar><i style="width:${n/qs.length*100}%"></i></div><p class=s>${t('vq')}</p><div class=big style="margin:14px 0">${q.c.replace('____','<span style="border-bottom:3px solid var(--g);padding:0 14px">____</span>')}</div>${sh(q.o).map(o=>`<button class=opt onclick="W(this,'${o}')">${o}</button>`).join('')}<div class=fb id=fb></div><div class=ex id=ex></div></div>`}
window.W=(b,o)=>{if(lock)return;lock=1;const q=qs[n],good=o==q.a;[...document.querySelectorAll('.opt')].forEach(x=>{if(x.textContent==q.a)x.className='opt ok'});if(!good)b.className='opt no';if(good)sc++;document.getElementById('fb').className='fb '+(good?'ok':'no');document.getElementById('fb').textContent=good?t('ok'):t('no')+' '+q.a;document.getElementById('ex').textContent=q.x;say(q.c.replace('____',q.a));setTimeout(()=>{lock=0;n++;show()},2800)};show()}
function cta(){app.innerHTML=hd('Fala Bem','hub()')+`<div class=bd><div class=cta><div style="font-size:54px">🎉</div><h2>${Object.keys(done).length>=total()?t('all'):''}</h2><h2>${t('ctaT')}</h2><p>${t('ctaP')}</p><div class=price>🎁 ${t('price')}</div><a class=go href="https://falabem.app.br" target="_blank" rel="noopener">${t('btn')} →</a><p style="font-size:12px;margin-top:12px">falabem.app.br · Português · Kreyòl · English · Español</p></div></div>`}
lang();
</script></body></html>
